services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      RECRUITAI_PASSWORD: ${RECRUITAI_PASSWORD:?Set a workspace password of at least 16 characters}
      RECRUITAI_ORIGIN: ${RECRUITAI_ORIGIN:-https://recruitai.example.com}
      RECRUITAI_DB: /app/var/recruitai.sqlite3
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - recruitai-data:/app/var
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2
volumes:
  recruitai-data:
